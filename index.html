<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gocards</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #1a1a1a;
    --fg: #e8e8e8;
    --muted: #888;
    --card-bg: #262626;
    --border: #3a3a3a;
    --accent: #6ab0f3;
    --yes: #6ec47e;
    --no: #d77c7c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .screen { width: 100%; max-width: 720px; display: none; }
  .screen.active { display: block; }
  h1 { text-align: center; font-weight: 300; letter-spacing: 0.15em; margin-bottom: 2rem; }
  .picker {
    display: block;
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 3rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .picker:hover, .picker.dragover { border-color: var(--accent); background: #202020; }
  .picker input { display: none; }
  .picker .hint { color: var(--muted); font-size: 0.85rem; margin-top: 0.6rem; }
  .resume {
    margin-top: 1rem;
    padding: 1rem;
    background: var(--card-bg);
    border-radius: 8px;
    text-align: center;
  }
  .resume .row { margin-top: 0.75rem; display: flex; gap: 0.5rem; justify-content: center; }
  button {
    background: var(--card-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    font-family: inherit;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .progress {
    text-align: center;
    color: var(--muted);
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 2.5rem 2rem;
    min-height: 280px;
    max-height: 70vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.25rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
    cursor: pointer;
    white-space: pre-wrap;
  }
  .card .back {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    width: 100%;
  }
  .card .hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 1.5rem;
  }
  .controls { display: flex; gap: 1rem; justify-content: center; }
  .controls button { flex: 1; max-width: 200px; padding: 0.9rem; }
  .btn-yes { border-color: var(--yes); color: var(--yes); }
  .btn-yes:hover:not(:disabled) { background: var(--yes); color: var(--bg); }
  .btn-no { border-color: var(--no); color: var(--no); }
  .btn-no:hover:not(:disabled) { background: var(--no); color: var(--bg); }
  .done { text-align: center; padding: 3rem 1rem; }
  .done h2 { font-weight: 300; }
  kbd {
    background: #333;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    font-size: 0.85em;
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>

<div id="start" class="screen active">
  <h1>gocards</h1>
  <label class="picker" id="picker">
    <input type="file" id="file-input" accept=".csv,.txt,text/csv,text/plain">
    <div>Click or drop a CSV file</div>
    <div class="hint">Two columns: front, back. Wrap math in <kbd>$...$</kbd>.</div>
  </label>
  <div id="resume" class="resume" style="display:none;"></div>
</div>

<div id="study" class="screen">
  <div class="progress" id="progress"></div>
  <div class="card" id="card">
    <div class="front" id="card-front"></div>
    <div class="back" id="card-back" style="display:none;"></div>
    <div class="hint" id="card-hint">Click or press <kbd>Space</kbd> to reveal</div>
  </div>
  <div class="controls">
    <button class="btn-no" id="btn-no" disabled>✗ Again (<kbd>n</kbd>)</button>
    <button class="btn-yes" id="btn-yes" disabled>✓ Got it (<kbd>y</kbd>)</button>
  </div>
</div>

<div id="done" class="screen">
  <div class="done">
    <h2>Session complete</h2>
    <button id="btn-restart">Load another deck</button>
  </div>
</div>

<script>
const MIN_GAP = 5;
const MAX_GAP = 10;

const $ = (id) => document.getElementById(id);

// --- CSV parsing (handles quoted fields, escaped quotes, \r\n) ---
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row);
      row = []; field = ''; i++; continue;
    }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows
    .filter(r => r.length >= 2 && (r[0].trim() || r[1].trim()))
    .map(r => ({ front: r[0].trim(), back: r[1].trim() }));
}

// --- State ---
let queue = [];
let deckName = '';
let revealed = false;

// --- Screens ---
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

// --- Persistence (per deck filename) ---
const key = (name) => `gocards:${name}`;
function save() {
  if (queue.length) localStorage.setItem(key(deckName), JSON.stringify(queue));
  else localStorage.removeItem(key(deckName));
}
function loadSaved(name) {
  const raw = localStorage.getItem(key(name));
  if (!raw) return null;
  try { const v = JSON.parse(raw); return Array.isArray(v) ? v : null; }
  catch { return null; }
}

// --- LaTeX ---
function renderLatex(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
      ],
      throwOnError: false,
    });
  }
}

// --- Card rendering ---
function renderCard() {
  if (!queue.length) { save(); show('done'); return; }
  const card = queue[0];
  $('card-front').textContent = card.front;
  $('card-back').textContent = card.back;
  $('card-back').style.display = 'none';
  $('card-hint').style.display = '';
  $('btn-yes').disabled = true;
  $('btn-no').disabled = true;
  revealed = false;
  renderLatex($('card-front'));
  $('progress').textContent = `${queue.length} card${queue.length === 1 ? '' : 's'} left`;
}

function reveal() {
  if (revealed || !queue.length) return;
  revealed = true;
  $('card-back').style.display = '';
  $('card-hint').style.display = 'none';
  $('btn-yes').disabled = false;
  $('btn-no').disabled = false;
  renderLatex($('card-back'));
}

function answer(correct) {
  if (!revealed || !queue.length) return;
  const [card] = queue.splice(0, 1);
  if (!correct) {
    const gap = Math.floor(Math.random() * (MAX_GAP - MIN_GAP + 1)) + MIN_GAP;
    queue.splice(Math.min(gap, queue.length), 0, card);
  }
  save();
  renderCard();
}

// --- Deck loading ---
function startSession(cards, name) {
  queue = cards;
  deckName = name;
  save();
  show('study');
  renderCard();
}

function buildResumePrompt(name, savedCards, freshCards) {
  const el = $('resume');
  el.innerHTML = '';
  el.style.display = '';

  const line = document.createElement('div');
  line.append('Resume ');
  const strong = document.createElement('strong');
  strong.textContent = name;
  line.append(strong, ` — ${savedCards.length} card${savedCards.length === 1 ? '' : 's'} left?`);

  const row = document.createElement('div');
  row.className = 'row';
  const bResume = document.createElement('button');
  bResume.textContent = 'Resume';
  bResume.onclick = () => { el.style.display = 'none'; startSession(savedCards, name); };
  const bFresh = document.createElement('button');
  bFresh.textContent = 'Start fresh';
  bFresh.onclick = () => { el.style.display = 'none'; startSession(freshCards, name); };
  row.append(bResume, bFresh);

  el.append(line, row);
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const cards = parseCSV(e.target.result);
    if (!cards.length) { alert('No cards found in file.'); return; }
    const saved = loadSaved(file.name);
    if (saved && saved.length) buildResumePrompt(file.name, saved, cards);
    else startSession(cards, file.name);
  };
  reader.readAsText(file);
}

// --- Events ---
$('file-input').addEventListener('change', (e) => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});
const picker = $('picker');
picker.addEventListener('dragover', (e) => { e.preventDefault(); picker.classList.add('dragover'); });
picker.addEventListener('dragleave', () => picker.classList.remove('dragover'));
picker.addEventListener('drop', (e) => {
  e.preventDefault();
  picker.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

$('card').addEventListener('click', reveal);
$('btn-yes').addEventListener('click', () => answer(true));
$('btn-no').addEventListener('click', () => answer(false));
$('btn-restart').addEventListener('click', () => {
  $('file-input').value = '';
  $('resume').style.display = 'none';
  show('start');
});

document.addEventListener('keydown', (e) => {
  if (!$('study').classList.contains('active')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); reveal(); }
  else if (e.key === 'y' || e.key === 'Y') answer(true);
  else if (e.key === 'n' || e.key === 'N') answer(false);
});
</script>
</body>
</html>
