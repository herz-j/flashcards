[project]
name = "flashcards"
version = "0.1.0"
description = "A tiny Tkinter flashcard deck runner with optional LaTeX rendering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "tkinterdnd2>=0.6.3",
]

[tool.uv]
# Drag-and-drop needs a tkdnd binary matching the interpreter's Tcl. Every
# uv-managed Python ships Tk 9.0.3, and tkinterdnd2 bundles no Tcl 9 build for
# Intel macOS -- so .python-version points at a python.org interpreter (Tk 8.6),
# which does have one. Delete that pin to fall back to a managed Python: the app
# still runs, just without drop support.
python-preference = "system"

[project.scripts]
flashcards = "flashcards:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The app is a single top-level module, not a package directory.
only-include = ["flashcards.py"]
