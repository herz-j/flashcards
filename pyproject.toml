[project]
name = "flashcards"
version = "0.1.0"
description = "A tiny Tkinter flashcard deck runner with optional LaTeX rendering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
]

[project.scripts]
flashcards = "flashcards:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["flashcards.py"]
